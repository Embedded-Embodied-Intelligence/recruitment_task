name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,notebook,harness]"
      - name: Tests (generator, traps, reference fairness, scorer, harness)
        run: python -m pytest -q
      - name: Data and answer key regenerate byte for byte
        run: |
          make data
          git diff --exit-code -- data eval
      - name: Expert notebook still solves the task
        run: |
          make reference
          git diff --exit-code -- reference/reference_answer.json
          python - <<'PY'
          import json
          from edabench.scorer import score_text
          answer = open("reference/reference_answer.json").read()
          total = score_text(answer, json.load(open("eval/ground_truth.json")))["total"]
          print("reference score:", total)
          assert total >= 0.98, total
          PY
