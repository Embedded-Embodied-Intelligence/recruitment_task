# Experiment definition. API keys are read from the environment variables named here.
seed: 42
n_runs: 5
temperature: 1.0   # provider default; we measure typical behaviour, not a cherry-picked greedy run

dataset:
  n_batches: 3000

# Each trap (docs/task_design.md, section 4) can be switched off for ablation runs;
# a variant without traps should score ~1.0. Missing names default to on, unknown names fail.
traps:
  duplicates: true           # T1
  hidden_missing: true       # T2
  mixed_units: true          # T3
  inconsistent_labels: true  # T4
  aggregation: true          # T5
  nonlinear_effect: true     # T6
  confounding: true          # T7
  leakage: true              # T8
  simpson_paradox: true      # T9
  regime_change: true        # T10

models:
  - name: claude-sonnet
    backend: claude_cli
    model_id: sonnet
  - name: gemini-flash
    backend: openai_compatible
    model_id: TBD          # pinned in Stage 6 after checking the free-tier roster
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/   # verify in Stage 6
    api_key_env: GEMINI_API_KEY
  - name: gpt-oss-120b
    backend: openai_compatible
    model_id: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
